# 发布工作流（恢复自 b9c6e41，见 开发计划.md 坑位 64 与「已知坑位」）
#
# #################### 这份文件为什么曾被删除、又如何恢复 ####################
#
# 732c442「Delete .github/workflows directory」把它删掉了，之后**从未恢复**。
# 后果是 v0.2.1 打 tag 后 Actions 计数为 **0**，什么都没产出：
#
#   $ curl .../actions/runs      → total_count: 0
#   $ curl .../contents/.github/workflows → Not Found
#
# 没有 workflow 文件，tag 推送就没有任何东西可以触发。
# 这正是 v0.2.0 的坏二进制只能在本地 build.sh 产出的原因
# （本地那个 web/dist 是陈旧的，于是 embed 进了引用 runtime.js 的旧 bundle，
#  表现为整页白屏；详见坑位 64）。
#
# 本文件恢复自 b9c6e41（删除前的最后一个可用版本），并做三处**必要**调整，
# 每处都在下方写明原因。
name: Release

on:
  push:
    tags:
      - '*' # 只要提交 tag 就触发，不限制格式

permissions:
  contents: write

jobs:
  # 第一步：只编译一次前端，作为产物传给后续所有架构复用
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      # ########## 调整 1：构建后立刻断言产物自洽（P0 白屏防线） ##########
      #
      # build.sh 里已有同样的三道校验，但那是在**下载 artifact 之后**、
      # 每个架构各跑一遍——16 个 job 里如果产物是坏的，你会看到 16 个
      # 一模一样的失败，而不是一个清晰的"前端产物有问题"。
      #
      # 在这里加一道，是为了让失败**发生在最上游、只发生一次**，
      # 且错误信息直接指向 npm run build。
      #
      # 校验内容必须与 build.sh 保持一致（两处漂移会让防线形同虚设）：
      #   ① assets/vue.js 存在（importmap 的目标）
      #   ② assets/ 内不得残留 runtime.js 引用
      #   ③ 入口 chunk 必须含 import("./vue.js")
      - name: Verify frontend artifacts
        run: |
          set -euo pipefail
          test -f web/dist/assets/vue.js || {
            echo "::error::web/dist/assets/vue.js 缺失（importmap 指向的 Vue 入口）"
            exit 1
          }
          if grep -rqs "runtime\.js" web/dist/assets/; then
            echo "::error::web/dist/assets/ 中仍存在 runtime.js 引用，会导致整页白屏"
            grep -rcls "runtime\.js" web/dist/assets/
            exit 1
          fi
          if ! grep -qs 'import("\./vue\.js")' web/dist/assets/index-*.js; then
            echo "::error::入口 chunk 未引用 ./vue.js，浏览器将白屏"
            exit 1
          fi
          echo "前端产物校验通过"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          # ########## 调整 2：保留隐藏文件 ##########
          #
          # upload-artifact@v4 默认**排除隐藏文件**，而 web/dist/.gitkeep
          # 是隐藏文件。虽然 .gitkeep 本身不参与运行，但 web/dist 目录
          # 的完整性值得保留（go:embed 要求目录非空，缺了占位文件在
          # 某些边界下会报 "no matching files found"）。
          # 显式声明比依赖默认行为更不容易在未来版本升级时踩坑。
          include-hidden-files: true
          if-no-files-found: error

  # 第二步：调用 build.sh 编译 16 个平台，只产出裸二进制
  build-binaries:
    name: Build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          # ########## 调整 3：Windows 三个目标保留，Linux 13 个保留 ##########
          # 这正是"16 平台矩阵"。注意 internal/terminal 在 Windows 上
          # 依赖 creack/pty 自带的 start_windows.go stub（返回 ErrUnsupported），
          # 因此**编译通过、运行时优雅降级**，不需要平台拆分文件。
          - { os: windows, arch: 386 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
          - { os: linux, arch: 386 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm }
          - { os: linux, arch: arm64 }
          - { os: linux, arch: loong64 }
          - { os: linux, arch: mips }
          - { os: linux, arch: mips64 }
          - { os: linux, arch: mips64le }
          - { os: linux, arch: mipsle }
          - { os: linux, arch: ppc64 }
          - { os: linux, arch: ppc64le }
          - { os: linux, arch: riscv64 }
          - { os: linux, arch: s390x }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Build via build.sh
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          VERSION: ${{ github.ref_name }}
          SKIP_FRONTEND: '1' # 前端已在 build-frontend 里编译并校验过了
          PACK_TARBALL: '0'  # 不打包 tar.gz，只留裸二进制
        run: |
          chmod +x ./build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lipanel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*
          if-no-files-found: error

  # 第三步：收集并发布，只发裸二进制
  publish:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          # 只抓裸二进制文件（windows 带 .exe，linux 无后缀，全部匹配 lipanel_*）
          files: |
            dist/**/lipanel_*
          generate_release_notes: true
          draft: false
