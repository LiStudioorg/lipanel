name: Release

on:
  push:
    tags:
      - '*' # 只要打标签，自动触发全架构编译

permissions:
  contents: write

jobs:
  # 第一步：只编译一次前端，作为产物传给后续所有架构复用
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # 第二步：45 个平台全部在 Ubuntu 上编译
  build-binaries:
    name: Build ${{ matrix.target.os }}-${{ matrix.target.arch }}
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: aix, arch: ppc64 }
          - { os: android, arch: 386 }
          - { os: android, arch: amd64 }
          - { os: android, arch: arm }
          - { os: android, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: dragonfly, arch: amd64 }
          - { os: freebsd, arch: 386 }
          - { os: freebsd, arch: amd64 }
          - { os: freebsd, arch: arm }
          - { os: freebsd, arch: arm64 }
          - { os: illumos, arch: amd64 }
          - { os: js, arch: wasm }
          - { os: linux, arch: 386 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm }
          - { os: linux, arch: arm64 }
          - { os: linux, arch: loong64 }
          - { os: linux, arch: mips }
          - { os: linux, arch: mips64 }
          - { os: linux, arch: mips64le }
          - { os: linux, arch: mipsle }
          - { os: linux, arch: ppc64 }
          - { os: linux, arch: ppc64le }
          - { os: linux, arch: riscv64 }
          - { os: linux, arch: s390x }
          - { os: netbsd, arch: 386 }
          - { os: netbsd, arch: amd64 }
          - { os: netbsd, arch: arm }
          - { os: netbsd, arch: arm64 }
          - { os: openbsd, arch: 386 }
          - { os: openbsd, arch: amd64 }
          - { os: openbsd, arch: arm }
          - { os: openbsd, arch: arm64 }
          - { os: openbsd, arch: ppc64 }
          - { os: openbsd, arch: riscv64 }
          - { os: plan9, arch: 386 }
          - { os: plan9, arch: amd64 }
          - { os: plan9, arch: arm }
          - { os: solaris, arch: amd64 }
          - { os: wasip1, arch: wasm }
          - { os: windows, arch: 386 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      # 锁定 nfpm 版本，避免上游更新导致构建失败
      - name: Setup nfpm
        if: matrix.target.os == 'linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1

      - name: Build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          if [ "$GOOS" = "js" ] || [ "$GOOS" = "wasip1" ]; then EXT=".wasm"; fi
          OUT_NAME="lipanel_${VERSION}_${GOOS}_${GOARCH}${EXT}"
          
          # 编译
          GOOS=$GOOS GOARCH=$GOARCH go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${OUT_NAME}" \
            .
          
          # 打包 tar.gz
          tar -czvf "dist/lipanel_${VERSION}_${GOOS}_${GOARCH}.tar.gz" -C dist "${OUT_NAME}"
          
          # Linux 专属包（仅主流架构打 deb/rpm，防止 nfpm 不支持冷门架构）
          if [ "$GOOS" = "linux" ]; then
            case "$GOARCH" in
              amd64|arm64|386|arm|riscv64)
                cat > nfpm.yaml <<EOF
          name: "lipanel"
          arch: "${GOARCH}"
          platform: "linux"
          version: "${VERSION}"
          maintainer: "Lipanel Team"
          description: "轻量 Linux 面板"
          contents:
            - src: "dist/${OUT_NAME}"
              dst: "/usr/local/bin/lipanel"
              file_info:
                mode: 0755
          EOF
                nfpm pkg --packager deb --target "dist/lipanel_${VERSION}_linux_${GOARCH}.deb" || echo "跳过 deb 打包: 不支持的架构"
                nfpm pkg --packager rpm --target "dist/lipanel_${VERSION}_linux_${GOARCH}.rpm" || echo "跳过 rpm 打包: 不支持的架构"
                ;;
              *)
                echo "冷门架构 ${GOARCH}，仅生成 tar.gz，跳过 nfpm 打包。"
                ;;
            esac
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: lipanel-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*

  # 第三步：收集全部产物，自动发布 GitHub Release
  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/lipanel_*
            dist/**/*.tar.gz
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.wasm
          generate_release_notes: true
          draft: false
